name: Generate TFT
run-name: Generate TFTs for the next version
on:
  workflow_dispatch:

jobs:
  generateTft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Default docker version has a bug running 32 bit apps, so need to update: https://github.com/docker/cli/issues/6963
      # this can be removed once the default installed version is updated
      - id: docker_setup
        name: Set up Docker
        uses: docker/setup-docker-action@v5

      - id: checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}

      - id: cleanup
        name: Cleanup
        run: |
          rm -rf hmi
          mkdir -p hmi

      - id: build_tft
        uses: kohlerdominik/docker-run-action@v2.2.0
        with:
          run: /app/run.sh
          image: sztupy/nextion-hassio:0.5.0
          volumes: |
            ${{ github.workspace }}/options.json:/data/options.json
            ${{ github.workspace }}/images/backgrounds:/haconfig/images
            ${{ github.workspace }}/hmi:/haconfig/www
          options:
            --hostname="nextion-editor"

      - id: generate_commit
        name: Generate Commit
        run: |
          # Don't commit the HMIs, as they take too much space
          find hmi -name "*.hmi" -exec rm "{}" ";"

          # Set up commit message
          echo "message=Generated fresh TFTs" >> "$GITHUB_OUTPUT"

      - id: commit
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "${{ steps.generate_commit.outputs.message }}"
          branch: "dev"
