configuration:
  main:
    name: Configuration to build
    description: Enter the name of the configuration you wish to build when pressing START
  configs:
    name: Configurations
    description: List of various pre-set configurations. Once set up, enter the name of the config you actually wish to build in the field above
    fields:
      name:
        name: Config name
        description: The name of the configuration. You need to enter this in the "Configuration to build" section above
      result:
        name: Result file name
        description: The name of the file that will be generated. Will be added to "/config/www/<result>". Once generated it'll be available at "http://homeassistant.local:8123/local/<result>", and this is what you should set up in the "nextion_update_url" config in ESP Builder.
      base:
        name: NSPanel orientation
        description: Use "landscape" for "EU" and "US Landscape" systems. Use "portrait" for "US" systems
      background:
        name: Background config
        description: The background images that should be replaced
        fields:
          dark:
            name: Dark mode background
            description: The image file for the dark mode. Should be put inside the "/config" folder, e.g. a "panel/filename.png" entry should be present in "/config/panel/filename.png". Keep empty if you want to keep the default dark background.
          light:
            name: Light mode background
            description: The image file for the light mode. Should be put inside the "/config" folder, e.g. a "panel/filename.png" entry should be present in "/config/panel/filename.png".  Keep empty if you want to keep the default light background.
          splash:
            name: Splash screen background
            description: The image file for the splash screen. Should be put inside the "/config" folder, e.g. a "panel/filename.png" entry should be present in "/config/panel/filename.png".  Keep empty if you want to keep the default splash screen.
