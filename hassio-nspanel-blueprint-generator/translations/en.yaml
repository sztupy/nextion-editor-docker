configuration:
  repository:
    name: Repository URL
    description: Repository to download NSPanel Easy from
  branch:
    name: Branch name
    description: Branch or tag name to build
  configs:
    name: Configurations
    description: List of various pre-set configurations
    fields:
      enabled:
        name: Enabled
        description: Whether to build this configuration or not
      name:
        name: Config name
        description: The name of the build. This is the name of the file that will be generated as well. Will be added to "/config/www/<name>". Once generated it'll be available at "http://homeassistant.local:8123/local/<name>", and this is what you should set up in the "nextion_update_url" config in ESP Builder.
      base:
        name: NSPanel orientations to build
        description: Which orientations to build
        fields:
          landscape:
            name: Landscape (EU)
            description: EU devices and US devices mounted sideways with buttons on the right
          portrait:
            name: Portrait (US)
            description: US devices
          landscape_inverted:
            name: Inverted landscape
            description: US devices mounted sideways with buttons on the left, or EU devices mounted upside down
      background:
        name: Background config
        description: The background images that should be replaced. Files should be put inside the "/config" folder, e.g. a "panel/filename.png" entry should be present in "/config/panel/filename.png". Keep empty any of the values if you want to keep the default background for that option.
        fields:
          landscape:
            name: Landscape (EU) images
            description: Images for landscape (EU) builds
            fields:
              dark:
                name: Dark mode background
                description: The image file for the dark mode on landscape.
              light:
                name: Light mode background
                description: The image file for the light mode on landscape.
              splash:
                name: Splash screen background
                description: The image file for the splash screen on landscape.
          portrait:
            name: Portrait (US) images
            description: Images for portrait (US) builds
            fields:
              dark:
                name: Dark mode background
                description: The image file for the dark mode on portrait.
              light:
                name: Light mode background
                description: The image file for the light mode on portrait.
              splash:
                name: Splash screen background
                description: The image file for the splash screen on portrait.
  retries:
    name: Retries
    description: How many times to retry each configuration before giving up
  timeout:
    name: Timeout
    description: |
      How long each attempt to allow to run before giving up in seconds. Note: this is not a total timeout and will apply to each attempt separately
  create_debug_screenshots:
    name: Generate debug screenshots
    description: Generates debug screenshots once a second to allow debugging of failures
  no_processing:
    name: Disable processing
    description: |
      Don't process images but keep container running. Useful if RDP is enabled in the network settings to allow manual debugging. Note: when enabled only the first active element is generated before RDP opens.

network:
  3389/tcp: "RDP port for debug/manual use"
