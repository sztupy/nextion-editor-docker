name: "NSPanel Blueprint Background Generator"
description: >-
  Generates NSPanel Blueprint compatible Nextion TFT files with your custom background.
url: "https://github.com/sztupy/nextion-editor-docker"
slug: "nspanel-blueprint-generator"
init: false
arch:
  - amd64
map:
  - type: homeassistant_config
    read_only: False
    path: /haconfig
ports:
  3389/tcp: null
options:
  repository: https://github.com/edwardtfn/NSPanel-Easy
  branch: main
  configs:
    - enabled: true
      name: living_room
      base:
        landscape: true
        portrait: false
        landscape_inverted: false
      background:
        landscape:
          dark: rooms/landscape/living_room.png
          light:
          splash:
        portrait:
          dark:
          light:
          splash:
  retries: 5
  timeout: 300
schema:
  repository: str
  branch: str
  configs:
    - enabled: bool
      name: str
      base:
        landscape: bool?
        portrait: bool?
        landscape_inverted: bool?
      background:
        landscape:
          dark: str?
          light: str?
          splash: str?
        portrait:
          dark: str?
          light: str?
          splash: str?
  retries: int(1,100)
  timeout: int(1,6000)
  create_debug_screenshots: bool?
  no_processing: bool?
startup: once
boot: manual_only
image: docker.io/sztupy/nextion-hassio
version: 0.5.1
