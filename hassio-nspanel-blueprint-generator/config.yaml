name: "NSPanel Blueprint Background Generator"
description: >-
  Generates NSPanel Blueprint compatible Nextion TFT files with your custom background.
url: "https://github.com/sztupy/nextion-editor-docker"
slug: "nspanel-blueprint-generator"
init: false
arch:
  - amd64
map:
  - type: homeassistant_config
    read_only: False
    path: /haconfig
options:
  main: "living-room"
  configs:
    - name: living-room
      result: nspanel_living_room.tft
      base: portrait
      background_dark: /nspanel-generator/living_room.png
      background_light: /nspanel-generator/living_room.png
schema:
  main: str
  configs:
    - name: str
      result: str
      base: list(landscape|portrait)
      background_dark: str
      background_light: str
startup: once
boot: manual_only
image: docker.io/sztupy/nextion-hassio
version: 0.2.0
